name: Test
on:
  - push
  - pull_request
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go-version:
          - 1.26.x
          - 1.27.x
        platform:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Get dependencies
        run: go mod download
      - name: Test
        run: go test -v -race ./...
  round-trip:
    runs-on: ubuntu-latest
    services:
      emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.59
        ports:
          - 9010:9010
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.x
      - name: Round-trip diffs against the Spanner emulator
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
        run: go test -v ./internal/hammer
